name: iOS Beta P1

on:
  push:
    branches: [release/ios-beta-p1]

permissions:
  contents: read

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Validate beta release config
        run: node scripts/release-preflight.cjs beta
        env:
          EXPO_PUBLIC_ALCHEMY_API_KEY: ${{ secrets.EXPO_PUBLIC_ALCHEMY_API_KEY }}
          EXPO_PUBLIC_ALCHEMY_GAS_POLICY_ID: ${{ secrets.EXPO_PUBLIC_ALCHEMY_GAS_POLICY_ID }}
        continue-on-error: true
      - name: Build signed iOS beta
        run: |
          RESULTS_FILE="$RUNNER_TEMP/eas-ios-results.json"
          set +e
          npx eas-cli@latest build --platform ios --profile beta --non-interactive --wait --json > "$RESULTS_FILE"
          STATUS=$?
          set -e
          cp "$RESULTS_FILE" eas-ios-results.json
          exit "$STATUS"
      - name: Preserve EAS result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-ios-beta-p1
          path: frontend/eas-ios-results.json
          if-no-files-found: warn
