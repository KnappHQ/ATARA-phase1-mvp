name: Sync Render Deploy Branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'KnappHQ/ATARA-phase1-mvp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep Render deployment branch identical to main
        run: |
          git push origin HEAD:refs/heads/codex/atara-vault --force-with-lease
