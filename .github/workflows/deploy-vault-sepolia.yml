name: Deploy Vault Base Sepolia

on:
  push:
    branches:
      - release/vault-sepolia

permissions:
  contents: read

concurrency:
  group: deploy-vault-sepolia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
      DEPLOYER_PRIVATE_KEY: ${{ secrets.VAULT_DEPLOYER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Contract safety checks
        run: npm test && npm run abi:check
      - name: Ensure dedicated deployer key is configured
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "Missing repository secret VAULT_DEPLOYER_PRIVATE_KEY"
            exit 1
          fi
      - name: Check deployer and Base Sepolia balance
        run: |
          node --input-type=module <<'NODE'
          import { JsonRpcProvider, Wallet, formatEther } from 'ethers';
          const provider = new JsonRpcProvider(process.env.BASE_SEPOLIA_RPC_URL);
          const network = await provider.getNetwork();
          if (network.chainId !== 84532n) throw new Error(`Expected Base Sepolia 84532, got ${network.chainId}`);
          const wallet = new Wallet(process.env.DEPLOYER_PRIVATE_KEY, provider);
          const balance = await provider.getBalance(wallet.address);
          console.log(`Dedicated deployer address: ${wallet.address}`);
          console.log(`Base Sepolia ETH balance: ${formatEther(balance)}`);
          if (balance === 0n) throw new Error('Dedicated deployer has no Base Sepolia ETH for gas');
          NODE
      - name: Deploy immutable Vault factory
        run: npm run deploy:sepolia
      # Recorded before anything that can fail. Past this point the factory is
      # live on-chain and paid for; losing its address to a failed later step
      # would mean deploying a second one to find out where the first went.
      - name: Record the deployed address
        run: |
          MANIFEST=$(ls -t deployments/*.json | head -n 1)
          FACTORY=$(node -e "console.log(require('./' + process.argv[1]).factory)" "$MANIFEST")
          echo "VAULT_FACTORY_ADDRESS=$FACTORY" >> "$GITHUB_ENV"
          {
            echo "### ATARA Vault Base Sepolia"
            echo "Factory: \`$FACTORY\`"
            echo ""
            echo "Next, from a checkout:"
            echo '```'
            echo "cd contracts && npm run set:factory -- $FACTORY"
            echo '```'
            echo "then open a pull request. Also set \`VAULT_FACTORY_ADDRESS=$FACTORY\` on the backend."
          } >> "$GITHUB_STEP_SUMMARY"
      # Always uploaded, so the manifest survives a failed verification.
      - name: Upload deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atara-vault-base-sepolia
          path: contracts/deployments/*.json
          if-no-files-found: error
      - name: Verify deployment
        run: npm run verify:sepolia
