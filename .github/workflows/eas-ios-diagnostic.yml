name: EAS iOS Diagnostic

on:
  push:
    branches: [diagnostic/eas-ios-postinstall]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Reproduce EAS beta post-install preflight
        run: npx eas-cli@latest env:exec production -- node scripts/release-preflight.cjs beta
