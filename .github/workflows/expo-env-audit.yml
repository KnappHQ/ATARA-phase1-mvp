name: Expo Environment Audit

on:
  push:
    branches:
      - release/expo-env-audit

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Ensure Expo token exists
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing repository secret EXPO_TOKEN"
            exit 1
          fi
      - name: Fetch production environment variable metadata
        run: npx eas-cli@latest env:list production --format short > /tmp/eas-env.txt
      - name: Print variable names only
        run: |
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/eas-env.txt', 'utf8');
          const stripAnsi = (s) => s.replace(/\x1B\[[0-?]*[ -/]*[@-~]/g, '');
          const names = [...new Set(text
            .split(/\r?\n/)
            .map(stripAnsi)
            .filter((line) => line.includes('='))
            .map((line) => line.slice(0, line.indexOf('=')).trim())
            .filter((name) => /^[A-Z0-9_]+$/.test(name))
          )].sort();
          console.log('EAS_PRODUCTION_VARIABLE_NAMES');
          for (const name of names) console.log(`- ${name}`);
          console.log(`TOTAL=${names.length}`);
          NODE
