name: Refresh Cleanup Lockfiles

on:
  push:
    branches: [cleanup/beta-dead-code]

permissions:
  contents: write

jobs:
  lockfiles:
    if: ${{ !contains(github.event.head_commit.message, '[lockfiles]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/beta-dead-code
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git commit -m "chore: refresh cleanup lockfiles [lockfiles]"
          git push origin HEAD:cleanup/beta-dead-code
