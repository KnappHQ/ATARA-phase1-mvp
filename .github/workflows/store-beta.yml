name: Store Beta

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and submit
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - android
  push:
    branches:
      - release/store-beta

permissions:
  contents: read

concurrency:
  group: store-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            contracts/package-lock.json
      - name: Backend checks
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/atara
        run: npm ci && npm run build && npm test
      - name: Frontend checks
        working-directory: frontend
        run: npm ci && npm run lint && npm run typecheck
      - name: Contract checks
        working-directory: contracts
        run: npm ci && npm test && npm run abi:check
      - name: Release ownership and Vault preflight
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('frontend/app.json', 'utf8'));
          const eas = JSON.parse(fs.readFileSync('frontend/eas.json', 'utf8'));
          const owner = app?.expo?.owner;
          const factory = eas?.build?.beta?.env?.EXPO_PUBLIC_VAULT_FACTORY_ADDRESS;
          if (!owner || owner === 'karankoder') {
            console.error('Expo ownership has not been transferred to the ATARA-owned account/organization yet.');
            process.exit(1);
          }
          if (!factory || !/^0x[a-fA-F0-9]{40}$/.test(factory) || /^0x0{40}$/i.test(factory)) {
            console.error('Vault factory is not deployed/configured for the beta build.');
            process.exit(1);
          }
          // A beta pointing at nothing is exactly what must not reach
          // TestFlight: the app appends /api/v1 to this value, so it has to be
          // a bare https origin.
          const apiUrl = eas?.build?.beta?.env?.EXPO_PUBLIC_API_URL;
          if (!apiUrl) {
            console.error('EXPO_PUBLIC_API_URL is not set on the beta build profile.');
            process.exit(1);
          }
          let api;
          try {
            api = new URL(apiUrl);
          } catch {
            console.error(`EXPO_PUBLIC_API_URL is not a URL: ${apiUrl}`);
            process.exit(1);
          }
          if (api.protocol !== 'https:') {
            console.error(`EXPO_PUBLIC_API_URL must use https, got: ${apiUrl}`);
            process.exit(1);
          }
          if (api.pathname !== '/' || apiUrl.endsWith('/')) {
            console.error(`EXPO_PUBLIC_API_URL must be a bare origin with no path or trailing slash (the app appends /api/v1), got: ${apiUrl}`);
            process.exit(1);
          }
          console.log(`Release preflight OK: Expo owner=${owner}, Vault factory=${factory}, API=${apiUrl}`);
          NODE

  build-and-submit:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Ensure Expo authentication is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing repository secret EXPO_TOKEN"
            exit 1
          fi
      - name: Build and submit iOS beta
        if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
        run: npx eas-cli@latest build --platform ios --profile beta --auto-submit --non-interactive --no-wait
      - name: Build and submit Android beta
        if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
        run: npx eas-cli@latest build --platform android --profile beta --auto-submit --non-interactive --no-wait
