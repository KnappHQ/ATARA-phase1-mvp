name: Store Beta

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      profile:
        description: beta for stores; preview for an installable Android APK
        required: true
        default: beta
        type: choice
        options: [beta, preview]
      submit:
        description: Submit successful beta builds to TestFlight / Google Play internal testing
        type: boolean
        default: false
  push:
    branches: [release/store-beta]

permissions:
  contents: read

concurrency:
  group: store-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            contracts/package-lock.json
      - name: Backend checks
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/atara
        run: npm ci && npm run build && npm test
      - name: Frontend checks including both native bundles
        working-directory: frontend
        run: npm ci && npm run lint && npm run typecheck && npm run bundle:native && node --test scripts/release-preflight.test.cjs
      - name: Contract checks
        working-directory: contracts
        run: npm ci && npm test && npm run abi:check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_PROFILE: ${{ inputs.profile || 'beta' }}
      SUBMIT_BUILD: ${{ inputs.submit || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select requested platform
        id: selection
        run: |
          ENABLED=false
          if [ -z "${{ inputs.platform }}" ] || [ "${{ inputs.platform }}" = all ] || [ "${{ inputs.platform }}" = "$BUILD_PLATFORM" ]; then
            ENABLED=true
          fi
          if [ "$BUILD_PROFILE" = preview ] && [ "$BUILD_PLATFORM" = ios ]; then
            ENABLED=false
          fi
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
      - if: steps.selection.outputs.enabled == 'true'
        run: npm ci
      - name: Check Expo authentication and requested distribution
        if: steps.selection.outputs.enabled == 'true'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Configure the EXPO_TOKEN repository secret for tk41s-team. No Expo build was started."
            exit 1
          fi
          if [ "$BUILD_PROFILE" = preview ] && [ "$BUILD_PLATFORM" != android ]; then
            echo "Choose android for the preview APK. iOS beta uses TestFlight."
            exit 1
          fi
          if [ "$BUILD_PROFILE" = preview ] && [ "$SUBMIT_BUILD" = true ]; then
            echo "An internal APK cannot be submitted to stores. Choose beta."
            exit 1
          fi
      - name: Build and wait for signed artifacts
        if: steps.selection.outputs.enabled == 'true'
        run: |
          ARGS=()
          if [ "$SUBMIT_BUILD" = true ]; then ARGS+=(--auto-submit-with-profile beta); fi
          RESULTS_FILE="$RUNNER_TEMP/eas-build-results.json"
          set +e
          npx eas-cli@latest build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive --wait --json "${ARGS[@]}" > "$RESULTS_FILE"
          BUILD_STATUS=$?
          set -e
          cp "$RESULTS_FILE" build-results.json
          exit "$BUILD_STATUS"
      - name: Preserve build results
        if: always() && steps.selection.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-results-${{ matrix.platform }}
          path: frontend/build-results.json
          if-no-files-found: warn
