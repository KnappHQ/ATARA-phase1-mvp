name: Expo Project Preflight

on:
  push:
    branches:
      - release/expo-preflight

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Ensure Expo token exists
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing repository secret EXPO_TOKEN"
            exit 1
          fi
      - name: Confirm Expo identity
        run: npx eas-cli@latest whoami
      - name: Confirm linked EAS project
        run: npx eas-cli@latest project:info
