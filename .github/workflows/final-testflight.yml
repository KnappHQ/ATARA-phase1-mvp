name: Final TestFlight Release

on:
  push:
    branches: [release/testflight-final]

permissions:
  contents: read

concurrency:
  group: final-testflight-release
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Validate beta environment
        run: npx eas-cli@latest env:exec production 'node scripts/release-preflight.cjs beta' --non-interactive
      - name: Build and submit final iOS beta
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest build --platform ios --profile beta --non-interactive --wait --auto-submit-with-profile beta --json | tee testflight-build.json
      - name: Preserve release result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-testflight-build
          path: frontend/testflight-build.json
          if-no-files-found: warn
